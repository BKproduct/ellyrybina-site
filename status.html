:root{
  --forest:#EFE6D8; --forest2:#FBF7F0; --moss:#3F6629; --lime:#3F6629; --wine:#7A2342;
  --paper:#F8F3EA; --ink:#2B211C;
  --on-dark:#2B211C; --mut-dark:#6A5A4E; --line-d:#D9CBB6;
  --mut-light:#6A5A4E; --line-l:#D9CBB6;
  --serif:"Cormorant Garamond",Georgia,serif; --sans:Onest,system-ui,sans-serif;
  --gut:clamp(20px,4vw,48px); --max:1240px;
}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:72px}
body{font-family:var(--sans);font-size:18px;line-height:1.55;color:var(--on-dark);background:var(--forest);-webkit-text-size-adjust:100%}
img{display:block;max-width:100%;height:auto}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--lime);outline-offset:3px}
.wrap{max-width:var(--max);margin:0 auto;padding-inline:var(--gut)}
.dark{background:var(--forest);color:var(--on-dark)}
.light{background:var(--paper);color:var(--ink)}
section{padding-block:clamp(64px,9vw,120px)}
.kicker{font-size:14px;letter-spacing:.08em;text-transform:uppercase;font-weight:500;color:var(--lime);margin-bottom:18px}
.light .kicker{color:var(--moss)}
.hero .kicker{text-transform:none;letter-spacing:.02em;font-size:17px}
h1,h2,h3{font-family:var(--serif);font-weight:500;letter-spacing:-.01em;font-variant-numeric:lining-nums;font-feature-settings:"lnum" 1}
h1{font-size:clamp(44px,5.4vw,80px);line-height:1.12;text-wrap:balance}
h1 em,h2 em{font-style:italic;color:var(--lime)}
.light h2 em{color:var(--moss)}
h2{font-size:clamp(36px,4.4vw,58px);line-height:1.2;text-wrap:balance;max-width:24ch}
h3{font-size:30px;line-height:1.22}
p{text-wrap:pretty}
.lead{font-size:clamp(19px,1.6vw,22px);color:var(--mut-dark);max-width:46ch}
.light .lead{color:var(--mut-light)}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:12px 22px;border-radius:6px;font-weight:600;font-size:17px;text-decoration:none;border:1px solid transparent;transition:transform .2s,background-color .2s,color .2s}
.btn:hover{transform:translateY(-2px)}
.btn-lime{background:var(--lime);color:#17220F}
.btn-ghost{background:transparent;border-color:var(--mut-dark);color:var(--on-dark)}
.btn-ghost:hover{background:var(--on-dark);color:var(--forest)}
.btn-ink{background:var(--forest);color:var(--on-dark)}
.btn-line{background:transparent;border-color:var(--ink);color:var(--ink)}
.btn-line:hover{background:var(--ink);color:var(--paper)}


.ribbon{background:var(--lime);color:#17220F;font-size:15px}
.ribbon .wrap{display:flex;gap:16px;align-items:center;justify-content:space-between;padding-block:9px}
.ribbon button{background:#17220F;color:var(--lime);border:0;border-radius:5px;padding:7px 14px;font-weight:600;font-size:14px;white-space:nowrap}


header.top{position:sticky;top:0;z-index:20;background:var(--forest);border-bottom:1px solid var(--line-d)}
header.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:68px}
.brand{font-family:var(--serif);font-size:28px;font-weight:600;text-decoration:none;line-height:1.2}
.brand small{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;color:var(--mut-dark);margin-top:5px}
nav.main{display:flex;gap:28px}
nav.main a{text-decoration:none;font-size:16px;color:var(--mut-dark);padding-block:8px}
nav.main a:hover{color:var(--on-dark)}
.menu-btn{display:none;background:none;border:1px solid var(--line-d);border-radius:6px;padding:9px 14px;font-size:15px}
.hdr-cta{display:inline-flex}


.hero{padding-block:clamp(40px,6vw,88px) 0}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:clamp(32px,5vw,80px);align-items:center}
.hero .lead{margin:26px 0 34px}
.cta-row{display:flex;flex-wrap:wrap;gap:14px}
.photo{border:1px solid var(--line-d);border-radius:8px;overflow:hidden;background:#e6e2e1}
.photo img{width:100%}
.cap{display:flex;justify-content:space-between;gap:12px;font-size:14px;color:var(--mut-dark);margin-top:12px}
.facts{display:grid;grid-template-columns:repeat(3,1fr);margin-top:clamp(48px,6vw,80px);border-top:1px solid var(--line-d)}
.facts div{padding:22px 24px 26px 0;font-size:16px;color:var(--mut-dark)}
.facts div+div{padding-left:24px;border-left:1px solid var(--line-d)}
.facts b{display:block;font-family:var(--serif);font-size:26px;line-height:1.15;font-weight:500;color:var(--on-dark);margin-bottom:6px}


.doors{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:44px;align-items:start}
.door{display:block;text-align:left;background:transparent;border:1px solid var(--line-l);border-radius:8px;padding:26px 28px 24px;width:100%;transition:background-color .2s,color .2s,transform .2s}
.door:hover{background:var(--forest);color:var(--on-dark);transform:translateY(-2px)}
.door span.n{font-family:var(--serif);font-size:40px;line-height:1.2;color:var(--moss)}
.door:hover span.n{color:var(--lime)}
.door p{font-size:21px;line-height:1.38;margin:14px 0 18px}
.door span.go{font-size:15px;font-weight:600;letter-spacing:.02em}


.quiz-grid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(32px,5vw,80px);align-items:start}
.quiz-grid .lead{margin-top:24px}
.fine{font-size:15px;color:var(--mut-dark);margin-top:20px;max-width:46ch}
.qcard{background:var(--forest2);border:1px solid var(--line-d);border-radius:10px;padding:clamp(22px,3vw,36px)}
.qprog{height:3px;background:var(--line-d);border-radius:2px;overflow:hidden;margin-bottom:26px}
.qprog i{display:block;height:100%;width:100%;background:var(--lime);transform-origin:left;transform:scaleX(.25);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.qstep{font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut-dark);margin-bottom:10px}
.qcard h3{font-size:clamp(28px,3vw,36px);margin-bottom:22px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:transparent;border:1px solid var(--line-d);border-radius:8px;padding:15px 18px;font-size:18px;line-height:1.35;transition:border-color .2s,background-color .2s}
.opt:hover{border-color:var(--lime);background:rgba(214,242,92,.06)}
.qback{background:none;border:0;color:var(--mut-dark);font-size:15px;margin-top:18px;text-decoration:underline;text-underline-offset:4px;padding:6px 0}
.res h3{font-size:clamp(34px,4vw,48px);margin-bottom:14px}
.res h3 em{color:var(--lime)}
.res p{color:var(--mut-dark);margin-bottom:12px}
.res .rec{border-top:1px solid var(--line-d);margin-top:20px;padding-top:20px}
.res .rec b{display:block;font-family:var(--serif);font-size:28px;font-weight:500;line-height:1.15;color:var(--on-dark);margin:4px 0 16px}
.hidden{display:none!important}


.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:56px;position:relative}
.steps::before{content:"";position:absolute;left:0;right:0;top:34px;height:1px;background:var(--moss);transform-origin:left;transform:scaleX(0);transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
.steps.in::before{transform:scaleX(1)}
.step{padding:0 28px 0 0;position:relative}
.step .num{font-family:var(--serif);font-size:68px;line-height:1.2;background:var(--paper);display:inline-block;padding-right:16px;color:var(--moss)}
.step h3{font-size:30px;margin:18px 0 10px}
.step p{color:var(--mut-light);font-size:17px}
.shifts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:64px}
.shift{border-top:1px solid var(--ink);padding-top:16px;font-size:20px;line-height:1.35}


.formats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:48px;align-items:start}
.fcard{border:1px solid var(--line-d);border-radius:10px;padding:26px 24px;background:var(--forest2);display:flex;flex-direction:column;gap:14px;transition:border-color .3s}
.fcard.hl{border-color:var(--lime)}
.fcard h3{font-size:30px}
.fcard .what{color:var(--on-dark);font-size:17px}
.fcard .for{color:var(--mut-dark);font-size:16px}
.price{font-family:var(--serif);font-size:38px;line-height:1.2;margin-top:6px}
.price small{font-family:var(--sans);font-size:15px;color:var(--mut-dark)}
.tag{display:inline-block;align-self:flex-start;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--mut-dark);color:var(--mut-dark);border-radius:4px;padding:3px 8px}
.fcard .btn{margin-top:6px;justify-content:center}


.chips{display:flex;flex-wrap:wrap;gap:10px;margin:36px 0 28px}
.chip{background:transparent;border:1px solid var(--ink);border-radius:5px;padding:9px 16px;font-size:16px}
.chip[aria-pressed=true]{background:var(--ink);color:var(--paper)}
.rev{columns:3;column-gap:16px}
.rv{break-inside:avoid;border:1px solid var(--line-l);border-radius:8px;padding:24px;margin-bottom:16px;background:#fff}
.rv q{display:block;font-family:var(--serif);font-size:25px;line-height:1.32;quotes:"«" "»"}
.rv footer{margin-top:16px;font-size:15px;color:var(--mut-light)}
.rv footer b{display:block;color:var(--ink);font-weight:600;font-size:16px}
.rv.off{display:none}
.src{font-size:15px;color:var(--mut-light);margin-top:12px}


.about-grid{display:grid;grid-template-columns:minmax(0,.7fr) minmax(0,1.3fr);gap:clamp(32px,5vw,80px);align-items:start}
.about-grid .photo{max-width:380px}
.about-grid p{margin-top:18px;max-width:56ch;color:var(--mut-dark)}
details{border-top:1px solid var(--line-d)}
details:last-of-type{border-bottom:1px solid var(--line-d)}
summary{list-style:none;cursor:pointer;padding:20px 40px 20px 0;font-family:var(--serif);font-size:27px;line-height:1.32;position:relative}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";position:absolute;right:4px;top:18px;font-family:var(--sans);font-size:28px;color:var(--lime)}
details[open] summary::after{content:"–"}
details p{margin:0 0 22px;max-width:60ch}
.faq{margin-top:36px}


.posts{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:44px;align-items:start}
.post{display:block;text-decoration:none;border:1px solid var(--line-l);border-radius:8px;padding:24px;background:#fff;transition:transform .2s,border-color .2s}
.post:hover{transform:translateY(-3px);border-color:var(--ink)}
.post time{font-size:14px;color:var(--mut-light);letter-spacing:.04em}
.post p{font-family:var(--serif);font-size:26px;line-height:1.32;margin:12px 0 18px}
.post span{font-size:15px;font-weight:600}


.final-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,.7fr);gap:clamp(32px,5vw,80px);align-items:center}
.final .photo{max-width:340px}

footer.site{background:var(--forest);border-top:1px solid var(--line-d);padding-block:36px;font-size:16px;color:var(--mut-dark)}
footer.site .wrap{display:flex;flex-wrap:wrap;gap:12px 32px;justify-content:space-between;align-items:baseline}
footer.site .sep{font-style:normal}
footer.site a{text-underline-offset:4px}


.drawer{position:fixed;inset:0;z-index:50;display:none}
.drawer.open{display:block}
.drawer .bg{position:absolute;inset:0;background:rgba(10,16,12,.6)}
.drawer .panel{position:absolute;right:0;top:0;bottom:0;width:min(440px,100%);background:var(--paper);color:var(--ink);padding:28px 26px;overflow:auto}
.drawer h2{font-size:34px;max-width:none;clear:both;padding-top:18px}
.drawer ul{list-style:none;padding:0;margin:22px 0}
.drawer li{border-top:1px solid var(--line-l);padding:14px 0;font-size:17px;display:flex;flex-direction:column;gap:8px}
.drawer input[type=text]{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--mut-light);border-radius:6px;background:#fff;font:inherit;font-size:17px;color:var(--ink)}
.drawer .x{float:right;background:none;border:1px solid var(--ink);border-radius:5px;padding:8px 14px;font-size:15px}

.mmenu{display:none}
.js .rise{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s cubic-bezier(.2,.7,.2,1)}
.js .rise.in{opacity:1;transform:none}
.h1l{display:block;opacity:0;transform:translateY(26px);animation:rise .9s cubic-bezier(.2,.7,.2,1) forwards}
.h1l:nth-child(2){animation-delay:.12s}.h1l:nth-child(3){animation-delay:.24s}
@keyframes rise{to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.js .rise{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}.h1l{animation-duration:.01s}.steps::before{transition:none}}

@media (max-width:980px){
  nav.main,.hdr-cta{display:none}
  .menu-btn{display:block}
  .mmenu.open{display:block;background:var(--forest);border-bottom:1px solid var(--line-d)}
  .mmenu a{display:block;padding:16px var(--gut);border-top:1px solid var(--line-d);text-decoration:none;font-size:19px}
  .hero-grid,.quiz-grid,.about-grid,.final-grid{grid-template-columns:1fr}
  .hero-grid .photo-col{max-width:340px}
  .facts{grid-template-columns:1fr}
  .facts div,.facts div+div{padding:18px 0;border-left:0;border-top:1px solid var(--line-d)}
  .facts div:first-child{border-top:0}
  .doors{grid-template-columns:1fr}
  .steps{grid-template-columns:1fr;gap:34px}
  .steps::before{display:none}
  .step{padding:0}
  .step .num{background:none}
  .shifts{grid-template-columns:1fr}
  .formats{grid-template-columns:1fr 1fr}
  .rev{columns:1}
  .posts{grid-template-columns:1fr}
  .final .photo{max-width:260px}
}
@media (max-width:620px){
  body{font-size:17px}
  .formats{grid-template-columns:1fr}
  .ribbon .wrap{flex-direction:column;align-items:flex-start;gap:8px}
  .cta-row .btn{width:100%;justify-content:center}
}

.more-wrap{display:none;margin-top:8px}
@media (max-width:620px){
  section{padding-block:44px}
  .hero{padding-block:28px 0}
  h1{font-size:clamp(40px,11.5vw,52px)}
  h2{font-size:clamp(32px,9vw,40px)}
  .hero .lead{margin:18px 0 24px}
  .hero-grid .photo-col{max-width:250px;margin-inline:auto}
  .facts{display:none}
  .hero{padding-bottom:44px}
  .doors{gap:10px;margin-top:28px}
  .door{padding:16px 18px}
  .door span.n{display:none}
  .door p{font-size:19px;margin:0 0 10px}
  .steps{grid-template-columns:1fr 1fr;gap:26px 18px;margin-top:32px}
  .step .num{font-size:46px;padding:0}
  .step h3{font-size:26px;margin:8px 0 6px}
  .step p{font-size:16px;text-wrap:balance}
